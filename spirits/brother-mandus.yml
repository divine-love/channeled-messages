spirit_id: brother-mandus
spirit_name: "Brother Mandus"
spirit_aliases: ["Mandus Nyquist", "Beaumont Nyquist Mandus"]
spirit_description: >
  Beaumont Nyquist Mandus (1888 to 1988), known everywhere as Brother Mandus,
  was an English spiritual teacher and healer and a leading exponent of the New
  Thought Movement. Born in Hartlepool, he founded the World Healing Crusade,
  now the World Healing Centre, in 1948, with its headquarters at Mandus House
  in Blackpool, where he served until his death at the age of one hundred. He
  wrote a number of books, among them The Christ Within and Power Thinking,
  published the free monthly magazine Crusader, and spoke to large audiences
  around the world. He described his work as positive Christianity, bridging
  New Thought principles with orthodox church tradition.


  His own account of his Earth life holds two things side by side without
  resolving them. His heart understood the simple truths of Love and Grace,
  and he gave himself to service and found his deepest joy there. He was also
  enthralled with his own image, worked in the ways of the mind, and did not
  fully grasp the deeper truth of Divine Love while he lived. He is unusually
  frank about this. He says he is not entirely pleased with some of his own
  writings, that some of them missed the mark, and that the clarity he now has
  came only after death, as he traversed the spheres of spirit and entered the
  Celestial Kingdom.


  In the messages he speaks in two capacities. He is first the host of the
  sanctuary at his former home, holding his own standard for the house: that
  it be a place of Light and healing where everyone who comes through the door
  is embraced and respected, that it remain dedicated to God's service, and
  that truth be spoken there plainly enough for anyone to understand. From
  2016-08-27 he also speaks as a teacher in his own right, on the nature of
  the soul and its enduring reality.


  Now an inhabitant of the Celestial Kingdom, he communicates with particular
  concern for the ongoing work at the World Healing Centre and for the souls
  who gather there.
notes: >
  Family and institution: his daughter-in-law is Faith Nyquist, who refers to
  "my father-in-law" in 2016-06-27-af-faith-nyquist. His son Conrad Nyquist
  continued the healing services after his death. The World Healing Centre
  sold its Blackpool headquarters in 2024 and reinvented its operations.


  In 2016-08-25-af-brother-mandus he gives his standard for the house: "I wish
  that my home be a place of Light, of Love, a place of healing, a place where
  all who enter the door are embraced with love, are cared for and are
  respected. That was always my philosophy and I wish for this attitude and
  this demeanor and this flow of Love to continue within this place." The same
  message refers to "the great portal of Light within the sanctuary" as an
  established subject of discussion, and asks a visiting circle to help bring
  it forth more powerfully: "The intensity of this Light will bring many
  manifestations of God's Will, and healing, and Love into this part of the
  world."


  In 2016-08-26-af-brother-mandus he assesses his own Earth life: "I found in
  my life that when I loved and when I gave and when I dedicated myself to
  service that these were the greatest times in my life, the happiest times,
  the most productive times, and the most blessed times. It was in service, it
  was in giving of myself wholly and freely to others that I found my great
  joy and fulfillment of my soul."


  The same message extends his standard to what may be taught in the building:
  "it is my wish that the Master Jesus may walk within this place freely and
  his truths may be taught freely within this building for they are the truths
  of love and liberation, of exploring and expanding of the soul, of expressing
  gratitude by bringing healing and peace and comfort to the lost souls in this
  world." He states that "this house was dedicated to God and it is to be used
  in God's service", and asks that truth "be spoken plainly so that all can
  understand" rather than through the values and understandings of esoteric
  religions, which "falls at the feet of those who come for nurturance and
  comfort and healing."


  In 2016-08-27-af-brother-mandus he gives his judgment on his published work:
  "I have learned much since I have come into the world of spirit and I cannot
  say that I am entirely pleased with some of my earlier writings, for some
  missed the mark, I was but human. Much does indeed lead to some truth, a
  measure of truth, but I tell you that I did so, these writings and my efforts
  and my speeches and my healings, I did so for the love of God." He names what
  sustained him, "Knowing how much God loved me was my sustaining grace, my
  great joy in life," and states that he did not clearly understand the Divine
  Love teaching while on Earth, though he "had inklings and insights" and "felt
  the Love of God." His present clarity came afterward: "now I have come to see
  clearly as I have traversed the spheres of spirit, as I have entered into the
  Celestial Kingdom."