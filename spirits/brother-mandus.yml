spirit_id: brother-mandus
spirit_name: "Brother Mandus"
spirit_aliases: ["Mandus Nyquist", "Beaumont Nyquist Mandus"]
spirit_description: >
  Beaumont Nyquist Mandus (1888–1988), widely known as Brother Mandus, was a
  prominent English spiritual teacher, healer, and leading exponent of the New
  Thought Movement. Born in Hartlepool, England, he founded the World Healing
  Crusade (now the World Healing Centre) in 1948, headquartered at Mandus House
  in Blackpool, where he served until his death at age 100. He authored numerous
  books including The Christ Within and Power Thinking, published the free
  monthly magazine Crusader, and delivered inspired speeches to large audiences
  worldwide. He viewed his work as 'positive Christianity' bridging New Thought
  principles with orthodox church tradition. His own account of his Earth life
  in the Divine Love messages holds two registers side by side: that while his
  heart understood simple Truths of Love and Grace, he was also enthralled with
  his own image and worked in ways of the mind, not yet fully grasping the
  deeper Truth of Divine Love; and that his greatest, happiest, and most
  blessed times were found in loving, giving, and dedicating himself wholly to
  service. In the messages he speaks first as host of the sanctuary at his
  former home, holding his standard for the house, and, from 2016-08-27, also
  as a doctrinal voice in his own right, teaching on the soul's nature and its
  enduring reality. Now an inhabitant of the Celestial Kingdom, he communicates
  with particular concern for the ongoing work at the World Healing Centre and
  the souls who gather there.
notes: >
  His daughter-in-law is Faith Nyquist; in 2016-06-27-af-faith-nyquist Faith
  refers to "my father-in-law." Son Conrad Nyquist continued the healing
  services after his death. The World Healing Centre sold its Blackpool
  headquarters in 2024 and reinvented its operations. Gives his own standard
  for the house in 2016-08-25-af-brother-mandus: "I wish
  that my home be a place of Light, of Love, a place of healing, a place where
  all who enter the door are embraced with love, are cared for and are
  respected. That was always my philosophy and I wish for this attitude and this
  demeanor and this flow of Love to continue within this place."
  2016-08-25-af-brother-mandus refers to "the great portal of Light within the
  sanctuary" at the house as an established subject of discussion, and asks a
  visiting circle to help bring it forth more powerfully: "The intensity of this
  Light will bring many manifestations of God's Will, and healing, and Love into
  this part of the world."

  From 2016-08-26-af-brother-mandus, his own assessment of his Earth life:
  "I found in my life that when I loved and when I gave and when I dedicated
  myself to service that these were the greatest times in my life, the
  happiest times, the most productive times, and the most blessed times. It
  was in service, it was in giving of myself wholly and freely to others that
  I found my great joy and fulfillment of my soul."

  2016-08-26-af-brother-mandus extends that standard to what is taught in the
  building: "it is my wish that the Master Jesus may walk within this place
  freely and his truths may be taught freely within this building for they are
  the truths of love and liberation, of exploring and expanding of the soul, of
  expressing gratitude by bringing healing and peace and comfort to the lost
  souls in this world." He states in the same message that "this house was
  dedicated to God and it is to be used in God's service", and asks that truth
  "be spoken plainly so that all can understand" rather than through the values
  and understandings of esoteric religions, which "falls at the feet of those
  who come for nurturance and comfort and healing."

  From 2016-08-27-af-brother-mandus, his own judgment on his published work:
  "I have learned much since I have come into the world of spirit and I cannot
  say that I am entirely pleased with some of my earlier writings, for some
  missed the mark, I was but human. Much does indeed lead to some truth, a
  measure of truth, but I tell you that I did so, these writings and my
  efforts and my speeches and my healings, I did so for the love of God."
  In the same message he names what sustained him: "Knowing how much God loved
  me was my sustaining grace, my great joy in life." He states that he did not
  clearly understand the Divine Love teaching while on Earth, though he "had
  inklings and insights" and "felt the Love of God", and that his present
  clarity came after death: "now I have come to see clearly as I have
  traversed the spheres of spirit, as I have entered into the Celestial
  Kingdom."