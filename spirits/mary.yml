spirit_id: mary
spirit_name: "Mary, Mother of Jesus"
spirit_aliases: [Mary]
spirit_description: >
  Mary, the mother of Jesus, is one of the most frequent presences in the
  archive. Her own account of her Earth life differs sharply from the one
  tradition has carried.


  She was legally married to Joseph, who was a young man rather than the aged
  figure of tradition, and she bore eight children. Jesus, whom she calls
  Jeshua, was the firstborn. She names Judah and Jacob among her sons and Leah
  and Rachel among her daughters. She denies the virgin birth outright: Jesus
  was born naturally, and no one in the family had any inkling of what he
  would become. When he began to speak of God's Soul Quality living within his
  own being, the family believed him deranged.


  She did not understand who her son was until she stood at the foot of the
  cross. Only then, and in the days after his death, did pain and grief and
  love bring some of the Divine Love into her soul, and her love for him
  deepened into Divine Love later still. The family home did not survive the
  crucifixion. Joseph left on preaching missions, Jacob founded the Jerusalem
  sect, and her sons met death in missions of their own.


  She signs herself Mother of Jesus and Celestial Spirit. In the circles she
  speaks most often to those carrying something heavy: parents, grieving
  souls, and those who doubt their own progress. She returns again and again
  to children and to the young, and she also teaches doctrine in her own
  right, on the transforming of the law of compensation and on the difference
  between what the mind produces and what the soul knows.
notes: >
  Her account of her Earth life comes from 1963-12-26-ds-mary, received
  through Dr. Daniel Samuels, which is the earliest message in the archive.
  It is the source for her marriage to Joseph, the eight children, the naming
  of Judah, Jacob, Leah, and Rachel, the denial of the virgin birth, the
  family's belief that Jesus was deranged, her understanding arriving at the
  foot of the cross, and the breaking of the household afterward. She states
  in that message that "Judah and Thomas became his apostles"; Thomas's
  relation to the family is not stated explicitly, so it is left open here.
  She signs the message "Mother of Jesus and Celestial Spirit" and says she
  communicated with the approval of Jesus.


  Doctrinal contributions elsewhere in the archive: in 2016-05-02-af-mary she
  teaches that the law of compensation is transformed in its effect on the
  soul redeemed by the Father's Love, a claim Andrew takes up and expands in
  the same circle immediately afterward, in 2016-05-02-af-andrew. In
  2018-12-17-af-mary she distinguishes what the mind produces from what the
  soul knows, warning that much of what is taken for inner awareness is the
  mind's own creation.