spirit_id: james-padgett
spirit_name: "James Padgett"
spirit_aliases: ["Mr. Padgett", "James E. Padgett"]
spirit_description: >
  James E. Padgett (1852 to 1923) was a Washington, D.C. lawyer who became
  the primary medium for the foundational Divine Love messages, now known as
  the Padgett Messages. Beginning around 1914, he received thousands of
  communications from celestial spirits, including Jesus, his apostles, and
  many other high spirits, and these form the doctrinal basis of the Divine
  Love movement. Later messages often refer to him as the one through whom
  the teachings were first brought to the world.


  He describes the work as begun by a man filled with doubt and grief over
  the loss of his wife. Receiving the messages was a struggle. He questioned
  many of the passages the spirits wrote through him, and it took him some
  years to believe that what was being written was true. He persisted,
  praying for God's Love to enter his soul, and in time he came to accept
  the Truth, and then to love it. He says that much of what the volumes
  contain was written by him but not of him, by spirits who used him in much
  the way he now uses a medium to speak to this world.


  He was afraid of what others thought of him, fearful for his career, his
  reputation, and his standing in the community, because holding up the
  Truth in this way was unusual. He wanted to keep it a secret, letting in
  only the very few he trusted, and he confesses that his fears held him
  back to some degree.


  He now resides in spirit in the Celestial Kingdom, where he continues to
  seek Truth, Love, and a deeper knowing of his soul and of God. He speaks
  in this archive through Al Fike, and identifies himself as "Padgett,
  James Padgett, familiar to some."
notes: >
  In 2015-08-20-af-james-padgett he describes the work as begun by "one man
  who was filled with doubts and grief for the loss of his wife." Receiving
  the messages was a struggle, "It took me some years to believe that what
  was being written was true," and through prayer, "I prayed for God's Love
  to enter into my soul," he grew from accepting the Truth to loving it. He
  was afraid of what others thought, "fearful for my career, my reputation,
  my standing in the community," and confesses "my fears held me back to
  some degree. I did not want others to truly know what I was doing." He
  states his present condition in the first person, "now as I reside in this
  place, which is in spirit in the Celestial Kingdom," where "I continue to
  long and seek for Truth, for Love, for enlightenment, to truly know my
  soul, to truly know my Heavenly Father."


  In 2016-05-11-af-james-padgett he describes the authorship of the volumes
  received through him: "there are many things contained within these
  volumes which were written by me, but not of me, but by spirit who used me
  in ways similar to that way I use this instrument to communicate in this
  world." He identifies himself in closing as "Padgett, James Padgett,
  familiar to some."


  In 2016-08-17-af-james-padgett he says that when the truth came to him he
  was "afraid for my reputation" and wanted to keep it a secret, "only
  letting in those very few that I trusted."