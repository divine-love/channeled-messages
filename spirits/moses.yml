spirit_id: moses
spirit_name: "Moses"
spirit_aliases: ["Moses the Lawgiver"]
spirit_description: >
  Moses (c. 13th century BC). According to the Bible, Moses was the Hebrew
  prophet and lawgiver who led the Israelites out of slavery in Egypt and
  received the Ten Commandments on Mount Sinai. In the Divine Love messages he
  says that he lives in the Celestial Heavens, and draws on his own life of
  journeying and reliance on God's guidance to encourage those who gather. He
  speaks from within the religion of his Earth life, and repudiates the
  sacrifice of blood and the doctrine of the Vicarious Atonement as having had
  no effect upon the souls of men. He teaches
  that no written word, the Bible included, is absolute Truth, that Truth is
  perceived by each soul through its own rapport with God, and that error in
  another is met with humility and prayer rather than correction.
notes: >
  In 2015-10-05-af-moses he states where he lives and what his Earth life was:
  "I've come a great distance to be with you, my beloveds, for I live in the
  Celestial Heavens", and "when I was on Earth I journeyed near and far. My
  life was filled with journeys and I relied upon my Heavenly Father to guide
  me along my path and I sought His guidance and His presence in my life. And,
  in so doing, I brought a deep insight into myself and an ability to see, to
  have vision spiritually." He adds, "I journeyed far and I'm known amongst men
  for my journeys".

  In 2016-04-12-af-moses he speaks of the religion of his Earth life in the
  first person plural: "In our Jewish culture and religion, shedding of blood
  was a common attempt to appease God"; "we feared God and in many ways we
  blamed God for our mishaps"; "even when we practiced in the old days this
  sacrifice, it had no effect in our world"; and "We, the Jews, took great
  import upon the written word." In the same message he calls Jesus "our
  brother Jesus, a Jew, and a prophet, and the Messiah", and says of the
  spirits teaching alongside him, "we, who have tread this road for thousands
  of years, continue to evolve in our understanding of Truth."

  In 2016-11-28-af-moses he states that he was
  charged by God to bring together the Jews, his people, and that there were
  many conditions and much strife within that family, larger than those of the
  circle he addresses, and that they nonetheless united: "we did bond together,
  we did unite, we did put aside our differences." Speaks of having had his own
  challenges in that work, and says no challenge is too great when God has His
  hand in a life.