spirit_id: seretta-kem
spirit_name: "Seretta Kem"
spirit_aliases: ["Seretta"]
spirit_description: >
  Seretta Kem was a son of Ramses II, Pharaoh of Egypt, and the brother of
  Keea Atta Kem. He identifies himself as a healer and a chemist who lived in
  Egypt many thousands of years ago, when Egypt was a great nation with a
  beautiful culture that revered the Creator.


  Now an inhabitant of the Celestial Kingdom, he continues as a healer, in
  spirit and, when he can be used as God's channel, in this world. He works
  with those who desire to develop their spiritual gifts and who walk the path
  of Divine Love, and he describes his work in the language of his old trade:
  mixing chemicals and energies in the spirit world to help souls realise what
  lies within them. During prayer gatherings he performs intricate chemical
  transferences between souls, creating deep bonds between them and opening
  avenues of soul to soul communication.


  He names his own office in the seeker's cleansing plainly. He comes to
  assist in healing, in the expiation of the soul, and in the cleansing of
  body and spirit. He also invites anyone who needs him to call him by name,
  saying that to serve spirits and mankind in love is the great task and the
  great joy of an angel of the Celestial Heavens.


  In the messages he is a gentle teacher of healing and of mediumship, a
  guardian of the Circles of Light, and a guide for those seeking to raise
  their natural gifts through the power of Divine Love.
notes: >
  In 2015-03-29-af-seretta-kem he identifies himself as having lived in Egypt
  at the peak of that civilisation and confirms that he now resides in the
  Celestial Kingdom. In 2018-08-28-af-seretta-kem he identifies himself
  explicitly as a healer and a chemist, and describes mixing chemicals and
  energies to assist those developing spiritual gifts.


  In 2015-08-19-af-seretta-kem he describes living approximately four thousand
  years ago, and describes his role performing chemical transferences between
  souls during prayer gatherings. The four thousand year figure does not sit
  neatly with the reign of Ramses II, conventionally dated c. 1279 to 1213 BC,
  which is roughly three thousand three hundred years before the message was
  given. The discrepancy is recorded here rather than resolved.


  In 2016-07-13-af-seretta-kem he describes his own office in the seeker's
  cleansing: "I come to assist you in your healing, the expiation of your
  souls, and the cleansings of your bodies and of your spirits."


  In 2016-09-01-af-seretta-kem he issues an open invitation to be called upon:
  "when you need my help, ask for me by name and I will come to you in an
  effort to help you with whatever you are struggling with, for as an angel in
  the Celestial Heavens our great task and our great joy is to serve all
  spirits and mankind in love." He states in the same message that he
  continues as a healer both in spirit and, when he can be used as God's
  channel, in this world.


  Further messages on his central subjects include 2016-04-13-af-seretta-kem,
  The Greatest Healing Energy of All Is God's Divine Love.