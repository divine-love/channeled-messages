spirit_id: judas
spirit_name: "Judas of Kerioth"
spirit_aliases: ["Judas", "Judas Iscariot"]
spirit_description: "Judas of Kerioth, the apostle who betrayed Jesus, now a celestial spirit who speaks of his own passage from the Hells to the Celestial Kingdom as evidence that no soul is beyond the reach of God's Love."
notes: >
  The betrayal and its motive, from 2016-03-31-af-judas: Judas gives the motive
  as a political misreading rather than malice, "a naïve perception that he
  would turn the tables upon the oppressors and become the ruler of our land, a
  true king," followed by his horror at what happened. He calls Jesus "my dear
  and beloved brother" throughout, and includes himself among the disciples who
  misunderstood Jesus in his lifetime: "we glorified our brother, we put him
  upon a pedestal and we saw him as different and far above us. But we did not
  understand why he was different."

  The redemption, from 2014-10-11-af-judas, in his own words: "it was the power
  of God's Love that redeemed me and brought me from Hell to Heaven, from
  darkness to light, from deep remorse and sadness to joy and liberation." He
  names Divine Love as the agent, not absolution. Andrew gives the same rescue
  from the other side in 2018-03-02-af-andrew, describing his descent from the
  Celestial Heavens to the Hells to help him.

  The book bearing his name, "Judas of Kerioth," was received from 2001 onward
  through an anonymous medium and published via new-birth.net. He describes his
  own part in it as collaboration and says the rapport continues past
  publication: in 2014-10-11-af-judas, "I am close to him because he reads my
  messages, the book that is named with my name, and I impress upon him the
  truths which I intended to convey through this effort"; in 2016-03-31-af-judas,
  "I have been with this instrument often when he reads the book which I
  collaborated in writing... I am well satisfied with the efforts that we have
  made in this publication which is indeed meant to be widely distributed."

  He opens 2014-10-11-af-judas with "I have not spoken through this instrument
  for quite some time," so communications through Al Fike predate the earliest
  Judas message held in the archive.