spirit_id: laila
spirit_name: "Laila"
spirit_aliases: []
spirit_description: >
  Laila is a Celestial spirit who lived many years ago in the land now called
  Israel and followed Jesus during his life on earth. She has been asked to be a
  protector to a prayer circle forming in Bend, Oregon, and to assist in its
  work.
notes: >
  Biographical details from 2017-05-19-af-laila: she lived "many, many years
  ago" in "what you call Israel" and "followed the Master Jesus when he walked
  the earth"; she is "now an inhabitant of the Celestial Kingdom"; she has been
  asked to be the protector of those forming a circle in Bend and to assist them
  in their work.
