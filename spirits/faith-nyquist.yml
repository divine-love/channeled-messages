spirit_id: faith-nyquist
spirit_name: "Faith Nyquist"
spirit_aliases: ["Faith"]
spirit_description: >
  Faith Nyquist was a devout soul whose Earth life was dedicated to following
  God's Will, which took her on what she describes as a great and beautiful
  journey of Love. She walked the Earth not long ago and passed into spirit
  shortly before these messages began. Though she knew of God's Love and lived
  within His care and Light, she did not fully understand the power of Divine
  Love as those in the present circles do.


  Her great challenge on Earth was to be heard, to be seen, and to be
  acknowledged while she went about her Father's work. She names this candidly
  and returns to it, drawing on it to encourage anyone meeting the same
  difficulty in bringing Light into the world.


  She is the daughter-in-law of Brother Mandus, and speaks of the building at
  Blackpool as her old home and as those hallowed halls.


  Now in the Celestial Kingdom, she comes to the circles as a gentle,
  encouraging, and deeply loving presence. She speaks tenderly to those
  gathered as they grow in prayer, affirms the progress they cannot see in
  themselves, and assures them that God is never disappointed in them. She
  introduces herself simply as Faith, says she is often with them, and
  describes her work as bringing Light, Love, truth, and comfort into the
  world.
notes: >
  In 2015-08-20-af-faith-nyquist she confirms that she walked the Earth "not
  too long ago," that she dedicated her life to following God's Will, that she
  did not fully understand Divine Love during that life, and that she now
  resides in the Celestial Kingdom.


  In 2015-11-09-af-faith she discloses her great Earth life challenge: to be
  heard, seen, and acknowledged while doing God's work.


  In 2016-06-27-af-faith-nyquist she refers to Brother Mandus as her
  father-in-law: "my father-in-law is very pleased that you continue to
  persevere." Brother Mandus channelled to the same circle on the same day, in
  2016-06-27-af-brother-mandus.


  The World Healing Centre connection is strong but never stated outright in
  her own words. In 2016-03-30-af-faith-nyquist she speaks of "my old home"
  and "those hallowed halls," and that message's title abbreviates the place
  as WHC. In 2016-08-29-af-faith-nyquist, addressing a circle gathered in the
  Blackpool building, she calls it "my home": "your efforts to bring God's
  Will into my home." Brother Mandus had welcomed the same circle into what he
  calls his home in the same place three days earlier, in
  2016-08-26-af-brother-mandus. The identification rests on the message title,
  the shared surname, and the cross-message context rather than on any
  statement she makes herself.