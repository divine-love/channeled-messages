spirit_id: alec-gaunt
spirit_name: "Alec Gaunt"
spirit_aliases: []
spirit_description: >
  Alec Gaunt was a devoted worker for the Truth of Divine Love during his
  Earth life, facilitating its understanding through work with many people
  and many circles of Light. By his own account, his desires were stronger
  than God's Will and he pushed so hard that he passed into spirit sooner
  than he should have, a lesson he now shares candidly with those gathered
  to help them walk with greater patience and faith. In the Divine Love
  messages he appears as a warm and practical teacher on the themes of
  balance between self-will and God's Will, spiritual discipline, and the
  cooperative nature of life with God.
notes: >
  Key biographical message: 2018-05-09-af-alec-gaunt (Walk in Harmony With
  God's Will), Alec's most personal disclosure, revealing he passed into
  spirit sooner than he should have due to pushing too hard.
  States that he took part in bringing about the marriage of two members of the
  circle: "I played my part in bringing these two souls together, and I want
  them to know that this union was planned even as they were children and how
  the angels worked to bring them together." He describes the preparation as
  shared work by "those loving servants of God who mentored them and prepared
  them, those in spirit and those in the flesh," and says that when the two met
  "eye-to-eye, they recognized within themselves this was a union blessed by
  God." (2016-08-15-af-alec-gaunt)


  In 2017-01-23-af-alec-gaunt he names the circle as his charges and his part
  in its work: "I am Alec and I am always with you because you are my
  charges. It is my gift and blessing, to help oversee your work to establish
  the Truth of God's Love in this world."


  In 2017-01-25-af-alec-gaunt he speaks of a long association with the church
  where the message was received, in Burnaby: "I have come to this church many
  times over the many years I have had an association here. I have come in the
  flesh. I have come in spirit. I have worked with many of you who are here."


  In 2017-06-12-af-alec-gaunt he tells of his own path and of his attempt at
  Direct Voice in his earth life. He began through Spiritualism, "I started my
  spiritual path through spiritualism," and after he found the Divine Love he
  "wished to combine these two truths and ambitions into one, to bring the
  high teachers through and direct voice was my ambition." The attempt did not
  succeed: "I carried this almost single-handedly although I certainly had my
  assistants and those who prayed with me," and "as a group we lacked the soul
  development to allow this power to manifest as we so desired." He calls
  himself bonded to the circle he speaks to, "as you know we are bonded. I am
  your brother." He says Seretta Kem now leads the circle's development and
  its Direct Voice work, and asks the circle to study Seretta Kem's messages:
  "Listen to them more than once."