spirit_id: yogananda
spirit_name: "Yogananda"
spirit_aliases: ["Paramahansa Yogananda", "Mukunda Lal Ghosh"]
spirit_description: >
  Paramahansa Yogananda (1893 to 1952), born Mukunda Lal Ghosh, was an Indian
  yogi and spiritual teacher who introduced millions of Westerners to
  meditation and Kriya Yoga through his autobiography and through the
  Self-Realization Fellowship, which he founded in 1920. He established his
  ashram and sanctuary at Encinitas, California, where he lived and taught for
  many years.


  He describes arriving after death in the fourth sphere, still carrying the
  Eastern religious beliefs he had held, and progressing from there through
  the fifth, sixth, and seventh spheres of the natural love heavens. He
  crossed into the Celestial Kingdom only after releasing the mental beliefs
  that had come with him, and he describes the bliss of God's Love as beyond
  anything he knew on Earth or in the natural love spheres. He recounts
  meeting Jesus after entering spirit, who answered his questions, turned him
  toward the light of his own soul, and showed him how that soul could expand
  in love.


  He speaks with candour about what he got wrong. He acknowledges that he
  struggled with the integration of soul and mind during his Earth life, and
  he returns specifically to correct the doctrine of reincarnation that he
  taught and that many yogis and gurus of the East continue to teach. At the
  same time he holds that the higher Truth of God's Love and of soul awakening
  was always at the root of what he taught, however it was expressed in the
  language and tradition he inherited.


  Now an inhabitant of the Celestial Heavens, he continues to work for the
  awakening of humanity, and has expressed a deep desire to speak to many
  through the gift of Direct Voice mediumship. He is among the few spirits in
  the archive who have come through more than one medium.
notes: >
  In 2018-11-21-af-yogananda he acknowledges his own struggles with spiritual
  harmony during his Earth life, and expresses his desire to speak through
  Direct Voice mediumship.


  In 2018-11-22-af-yogananda he gives the detailed account of his journey
  through the spheres: arriving in the fourth after passing, still carrying
  his Eastern religious beliefs; progressing through the fifth, sixth, and
  seventh; entering the Celestial Kingdom after releasing those erroneous
  mental conditions; and describing the bliss of God's Love as beyond all
  earthly and natural love sphere experience.


  In 2019-01-31-af-yogananda he describes meeting Jesus after entering spirit.
  Jesus clarified his questions, directed him toward the light of his own
  soul, and helped him understand how his soul could expand in love. The same
  message addresses reincarnation and the perception of it held by many yogis
  and gurus of the East.


  He has spoken through more than one medium. Most of his messages come
  through Al Fike; 2019-04-01-jw-yogananda and 2019-04-08-jw-yogananda were
  received through Jimbeau Walsh.