spirit_id: lotus-blossom
spirit_name: "Lotus Blossom"
spirit_aliases: []
spirit_description: "Lotus Blossom is a celestial spirit who communicates with gentle wisdom and poetic imagery, speaking particularly on the themes of soul gifts, spiritual awakening, and the unfolding of divine purpose. She walks closely with the circle and offers both spiritual and physical assistance to those she accompanies."
notes: >
  By Goldie's account in 2017-07-16-af-goldie, Lotus Blossom was involved in
  years past with the development of Direct Voice, has special knowledge of
  the energy flows within the body and is a gifted healer, and is a guide to
  one member of the Direct Voice circle.