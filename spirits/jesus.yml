spirit_id: jesus
spirit_name: "Jesus of Nazareth"
spirit_aliases: ["Jesus", "Jeshu", "Jeshua", "Jesus the Christ", "Jesus Christ", "the Master"]
spirit_description: >
  Jesus of Nazareth (c. 4 BC to c. 30 AD) is the central figure of
  Christianity and the bearer of the message of God's Divine Love to
  humanity. He speaks in this archive more often than almost any other
  spirit, and much of what he says corrects the tradition built around his
  name.


  He was born naturally, the eldest of eight children in an ordinary family
  who had no inkling of what he would become. His mother describes a
  serious, studious, pious child who drank eagerly at the fountainhead of
  religious instruction, and a young man who by the age of twenty had begun
  to wonder whether he himself was the promised Messiah. Through prayer, his
  natural love was purified and deepened into Divine Love, which absorbed
  the ordinary turn toward marriage and family. While his brothers were
  drawn toward rebellion against Rome, he counselled peace and forbearance.
  When he spoke of God's Soul Quality living within his own being, his
  family believed him deranged.


  He teaches that he incarnated with one unique attribute, a purified soul
  protected by God from the conditions of the world, for a single purpose:
  to reopen the door to God's Love within the souls of mankind. His
  Messiahship was not a birthright but an attainment, reached through the
  inflowing of God's Love until he became, in time, God's true son. He
  taught in allegory and story, and his instruction to seek the Kingdom
  meant to seek God's Love, which creates that Kingdom within the soul.


  He states plainly that he was never God incarnate, that his death was not
  a blood sacrifice that saves anyone, and that he does not wish to be
  worshipped. He was a man who discovered the truth of God's Love, and in
  discovering it opened the door for everyone else. He asks to be received
  as a brother and a teacher rather than as an object of worship, and he
  redirects all worship to God.


  He was the first soul to enter the Celestial Kingdom and remains the sole
  inhabitant of its highest realm, where he continues to grow in God's Love.
  By prior agreement with God he incarnated as a complete and singular soul
  rather than as half of a soul pair, which is the condition of every other
  soul. He has no soulmate and feels no lack in this, since his love for all
  of humanity and his union with God are complete fulfillment. Mary
  Magdalene was not his soulmate.


  He will never return to Earth in the flesh, as this would contravene the
  laws of creation, in which progression moves eternally forward and never
  backward. He comes instead in his spirit body to speak to the world. He
  cautions that many spirits impersonate him, often through well-meaning but
  undiscerning mediums, and that only a soul awakened by Divine Love can
  discern his true presence from these errors.
notes: >
  His Earth life is described by his mother in 1963-12-26-ds-mary, received
  through Dr. Daniel Samuels. She calls him Jeshua, or Jeshu, and gives the
  account of his childhood, his brothers' leaning toward rebellion, and the
  family's belief that he was deranged when he spoke of God's Soul Quality
  within himself. She describes his Messiahship as attained through the
  inflowing of God's Love, and his death as the sacrifice of his life in
  carrying out his mission of preaching God's Divine Love, not a blood
  sacrifice.


  In 2016-04-02-af-jesus he corrects the doctrine of the vicarious atonement
  in his own words, saying that nothing could be further from the truth than
  that his death and blood could save humanity, and that this interpretation
  has wrought much pain and error in the world. In the same message he
  discloses the purified soul he was given at birth, the protection from
  worldly conditions that came with it, his purpose in reopening the door to
  God's Love, his use of allegory and story in teaching, and the meaning of
  "Seek ye the Kingdom."


  In 2016-09-02-af-jesus he states his non-divinity for the record: "And I
  was never God incarnate. No, my beloveds, I was a man who discovered the
  truth of God's Love and in my discovery opened the doors to its existence
  amongst mankind and all spirits." He places himself alongside those he
  addresses rather than above them, "I am with God as you are with God in
  your love for God," and asks not to be worshipped: "Beloved souls, do not
  worship me in any way for I am not God. I am your teacher... it is God you
  must worship; it is God you must reveal your heart and your souls to."


  In 2018-11-26-af-jesus he confirms that he was the first soul to enter the
  Celestial Kingdom and resides in its highest realms, that he will never
  return in the flesh, and that spirits impersonating his name are common and
  often unintentional. He affirms in the same message that God's Love is
  equal in intensity for every soul.


  In 2019-01-27-af-jesus he confirms that he incarnated as a complete soul by
  agreement with God, that Mary Magdalene was not his soulmate, and that he
  has no soulmate and no need of one.


  Speaking in 2016-07-04-af-jesus of the criticism his followers would meet,
  he recalls his own Earth life: "I, too, was the object of such ridicule
  when I walked the Earth. I, too, struggled with these conditions so
  prevalent in the world."