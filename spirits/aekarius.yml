spirit_id: aekarius
spirit_name: "Aekarius"
spirit_aliases: []
spirit_description: >
  Aekarius identifies himself as an inhabitant of the Celestial Kingdom who
  was once an astrologer and an astronomer, "very long days ago," in
  Phoenicia. He describes how astrology grew from his people's desire to
  predict the future and understand the world at a time when they did not
  have a clear understanding of the Creator, and says he has put those ideas
  aside as he has grown in the Love of God.
notes: >
  In 2017-03-09-af-aekarius he introduces himself: "My name is Aekarius and I
  have not spoken through this instrument before. I am an inhabitant of the
  Celestial Kingdom and I was once an astrologer and an astronomer very long
  days ago in the kingdom which you describe as Phoenicia." Of his people's
  beliefs he says, "We worshiped idols, we gave God many names and many
  personalities," and of himself, "this old astrologer has come to new
  understandings as he has grown in the Love of God."