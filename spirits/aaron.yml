spirit_id: aaron
spirit_name: "Aaron"
spirit_aliases: ["Aaron the High Priest", "Aaron the Levite"]
spirit_description: >
  Aaron was the elder brother of Moses and the first High Priest of Israel,
  a Levite who served as Moses' spokesman before Pharaoh and who led the
  priestly service of the Tabernacle through the wilderness years. In the
  Divine Love messages he comes as a blessing presence to the prayer circle,
  speaking of the angels who surround and accompany every soul who seeks
  the Love of God.
