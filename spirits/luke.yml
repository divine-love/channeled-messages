spirit_id: luke
spirit_name: "Luke"
spirit_aliases: ["Luke the Evangelist", "Saint Luke"]
spirit_description: >
  Luke the Evangelist (c. 1st century AD). The Bible names Luke as a
  physician and a companion of the apostle Paul, and Christian tradition
  identifies him as the author of the Gospel of Luke and the Acts of the
  Apostles, whose portrayal of Jesus is noted for its compassion and for its
  attention to healing, the poor, and the marginalized. In the Divine Love
  messages he speaks from the Celestial Kingdom and gives structured
  teachings, often in answer to questions and discussions raised within the
  circle. He has taught on the conditions of the world and their effect on
  every soul, the encrustations that life lays over the soul, the conditions
  carried from parent to child, the Law of Compensation as it operates on
  the natural love path and on the Divine Love path, judgment and the
  honesty required to see one's own part in it, and the limits of the mind
  in spiritual matters. His manner is warm and searching: he asks the circle
  directly whether they are willing to see themselves as they are, and tells
  them in the same breath that they are not to blame for their condition and
  must not reject themselves.
notes: >
  Places himself in the Celestial Kingdom in 2018-04-03-af-luke, speaking of
  "those judgments and feelings that cause barriers with we in the Celestial
  Kingdom" and of what celestial angels do and do not feel. Describes the
  standing of the angels toward the circle in 2018-06-24-af-luke: "we would
  not be capable or qualified to be your helpers and guides, teachers and
  gatekeepers for we would not be governed by love." Both statements are in
  the first person plural.

  Addresses individual members of the circle directly, as "dear daughter" in
  2018-04-03-af-luke and 2018-06-24-af-luke and as "my dear sons" in
  2018-09-22-af-luke, and opens by naming the question or discussion he is
  answering in 2018-04-03-af-luke, 2018-05-12-af-luke, 2018-06-24-af-luke
  and 2018-09-22-af-luke.

  In 2016-03-11-af-luke he states that the encrustations of the soul come of
  having lived in this world, "not because you are sinful and depraved", and
  asks the seeker to have compassion for themselves and to know they are not
  to blame for their condition.

  Referred to in 2016-02-29-af-confucius, where Confucius speaks of "our
  brother, Luke" as having spoken about joy and happiness. The spirit file
  was created from that reference.