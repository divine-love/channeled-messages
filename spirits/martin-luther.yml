spirit_id: martin-luther
spirit_name: "Martin Luther"
spirit_aliases: []
spirit_description: "Martin Luther (1483–1546), the German theologian and Augustinian monk whose Ninety-Five Theses sparked the Protestant Reformation, challenging the authority of the Catholic Church and reshaping Christianity in the Western world. Now a celestial spirit, he is a passionate advocate for aligning with God's Will above the will of man, drawing on his own earthly experience of opposition and persistence in service."
notes: >
  Speaks of his Earth life work and its revision in spirit: "I founded a
  reform movement and continue to reform within myself through the inflowing
  of God's Love." He describes having been certain of truth in that life, "I
  thought when I was on Earth that I knew truth. I fought for the truth. I
  suffered for the truth. And many followed me in my pursuit to bring reform
  to our church and to a degree I was successful", and states that he has
  since released much of it: "much of what I understood in those days I now
  have released to allow the infusion of soul truth." He credits Jesus with
  leading spirits to these realizations and holds that the label put upon the
  gift of God's Love does not matter. (2016-07-18-af-martin-luther)

  From 2016-08-31-af-martin-luther, delivered in Germany, his own account of
  the faculty behind his Earth work: "In my time my thinking was different and
  my efforts were born mainly of the mind, the material mind. Although
  something within me motivated me, something within my soul, God did indeed
  guide me, strengthen me, show me the way." He describes himself as "a man of
  rules, of intellect, but I was also a man who desired that the world change
  for the better," names his original aim as freedom to worship without the
  control of dogma, and states that it persists: "that we would all have
  freedom to worship God in our own way and this, beloved souls, is still my
  desire." He calls the gathering to "start a new Reformation."