spirit_id: martin-luther
spirit_name: "Martin Luther"
spirit_aliases: []
spirit_description: >
  Martin Luther (1483 to 1546) was the German theologian and Augustinian monk
  whose Ninety-Five Theses set off the Protestant Reformation, challenging the
  authority of the Catholic Church and reshaping Christianity across the
  Western world.


  He speaks here with unusual candour about that work. He describes himself as
  a man of rules and intellect who was certain he knew the truth, who fought
  and suffered for it, and who was to a degree successful. He also says that
  his efforts were born mainly of the material mind, and that much of what he
  understood in those days he has since released, to make room for the truth
  of the soul. Something within him motivated him even then, and he holds that
  God guided and strengthened him throughout, but the reform he led was not
  the deeper one.


  What he wanted has not changed: freedom to worship God without the control
  of dogma. He still wants it, and he now calls for a new Reformation, one
  that begins in the soul rather than in doctrine. He continues to reform
  within himself through the inflowing of God's Love, credits Jesus with
  leading spirits to these realizations, and holds that the label placed on
  the gift of God's Love does not matter.


  Now a Celestial spirit, he advocates for aligning with God's Will above the
  will of man, drawing on his own experience of opposition and persistence in
  service.
notes: >
  In 2016-07-18-af-martin-luther he speaks of his Earth work and its revision
  in spirit: "I founded a reform movement and continue to reform within myself
  through the inflowing of God's Love." He describes the certainty he held
  then, "I thought when I was on Earth that I knew truth. I fought for the
  truth. I suffered for the truth. And many followed me in my pursuit to bring
  reform to our church and to a degree I was successful", and states what has
  become of it: "much of what I understood in those days I now have released
  to allow the infusion of soul truth." In the same message he credits Jesus
  with leading spirits to these realizations, and holds that the label put
  upon the gift of God's Love does not matter.


  In 2016-08-31-af-martin-luther, delivered in Germany, he gives his own
  account of the faculty behind his Earth work: "In my time my thinking was
  different and my efforts were born mainly of the mind, the material mind.
  Although something within me motivated me, something within my soul, God did
  indeed guide me, strengthen me, show me the way." He describes himself as "a
  man of rules, of intellect, but I was also a man who desired that the world
  change for the better," names his original aim as freedom to worship without
  the control of dogma, and states that it persists: "that we would all have
  freedom to worship God in our own way and this, beloved souls, is still my
  desire." He calls the gathering to "start a new Reformation."