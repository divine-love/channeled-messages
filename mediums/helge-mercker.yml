medium_id: helge-mercker
medium_name: "Helge Mercker"
medium_aliases: []
medium_description: "Helge Mercker is a powerful medium within the Divine Love community and the author of several books on Divine Love, among them Living with the Divine Love. She founded the registered charity Children's Sanctuary Namibia (CSN), through which she offered a soup kitchen, and serves on its board and as the Namibian agent of the Children's Sanctuary Namibia Society. From 2012 to 2014 she spent two years re-typing the old manuscripts of messages from the last years of Alec Gaunt's life, and she has served on the board of the Divine Love Sanctuary Foundation."
notes: >
  In 2017-08-02-hm-augustine, Augustine speaks to her as teacher to student,
  and speaks of the group's preparation for Direct Voice.
