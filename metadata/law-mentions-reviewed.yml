# law-mentions-reviewed.yml
# Messages that name a spiritual Law in a general sense only, reviewed and
# deliberately not tagged with that Law's subject.
#
# The rule (schema.md, Subjects): tag a Law when the message uses it as a
# working Law, named alongside other Laws as one that operates, or described
# doing what its definition in subjects.yml says. A general phrase such as
# "in harmony with God's laws of Love" does not count.
#
# validate_messages.py warns when a message body names a Law whose subject is
# not tagged, whose phrase is not in keywords, and which is not listed here.
# A warning never fails the build. To clear one, either tag the subject or add
# the message_id under the Law's subject name below.
#
